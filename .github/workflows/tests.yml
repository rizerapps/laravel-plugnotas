name: tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Extremos da faixa suportada no composer.json.
          - php: '8.1'
            laravel: '10.*'
            testbench: '8.*'
          - php: '8.3'
            laravel: '13.*'
            testbench: '11.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Instalar dependencias
        run: |
          # O Composer bloqueia versoes com aviso de seguranca, o que inclui todo o
          # Laravel 10. Aqui so testamos compatibilidade; a escolha de versao e do projeto.
          composer config audit.block-insecure false
          composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}" "illuminate/console:${{ matrix.laravel }}" --no-update --no-interaction
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Testes
        run: vendor/bin/phpunit
